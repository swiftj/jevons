name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # macOS so lipo can build the universal darwin binary.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: make vet test
      - run: make release VERSION=${{ github.ref_name }}
      - name: Check binary version matches tag
        run: |
          got="$(./dist/jev_darwin_universal version)"
          test "$got" = "$GITHUB_REF_NAME" || { echo "jev version = $got, want $GITHUB_REF_NAME"; exit 1; }
          lipo -info dist/jev_darwin_universal
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/jev_*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/jev_* dist/SHA256SUMS --verify-tag --generate-notes
